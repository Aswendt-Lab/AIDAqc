name: aidaqc
channels:
  - conda-forge
  - defaults

dependencies:
  # Core
  - python=3.10
  - pip

  # Scientific stack
  - numpy
  - nilearn
  - scipy
  - pandas
  - matplotlib
  - seaborn
  - scikit-learn
  - scikit-image
  - imageio
  - pillow

  # Neuro/medical imaging + workflow
  - nibabel
  - nipype
  - traits

  # I/O, docs, utilities
  - lxml
  - openpyxl
  - pyyaml
  - requests
  - pypdf2
  - fpdf
  - lmfit
  - uncertainties
  - pydot
  - rdflib
  - xlrd
  - xlsxwriter

  # Notebooks (optional but convenient)
  - jupyterlab
  - ipykernel

  # Packages that are often easiest to install via pip on macOS arm64
  - pip:
      - alive-progress
      - raster-geometry
      - svg-stack
      - svgutils
      - simplejson
      # If your code imports "fitz", use PyMuPDF (it provides the fitz module)
      - pymupdf
